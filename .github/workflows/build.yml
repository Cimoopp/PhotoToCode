name: Build APK and EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            ccache libltdl-dev python3-dev

      - name: Установка buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer

      - name: Кэш сборки
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Сборка APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoToCode-APK
          path: bin/*.apk
          if-no-files-found: error

  exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install kivy pillow pyinstaller

      - name: Сборка EXE
        run: pyinstaller --noconfirm --onefile --windowed --name PhotoToCode main.py

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoToCode-EXE
          path: dist/PhotoToCode.exe
          if-no-files-found: error

  release:
    name: Публикация файлов
    needs: [apk, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: PhotoToCode — последняя сборка
          body: |
            Готовые файлы, собранные автоматически:
            * PhotoToCode.exe — для Windows
            * PhotoToCode-debug.apk — для Android
          files: out/**/*
